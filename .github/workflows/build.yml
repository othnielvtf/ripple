name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Build universal app
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, sign, and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            ./Scripts/package-release.sh "${RELEASE_TAG#v}"
          else
            ./Scripts/package-release.sh
          fi
      - name: Verify bundle and architectures
        run: |
          codesign --verify --deep --strict dist/Ripple.app
          lipo -verify_arch arm64 x86_64 dist/Ripple.app/Contents/MacOS/Ripple
          plutil -lint dist/Ripple.app/Contents/Info.plist
          test -s dist/Ripple.app/Contents/Resources/LICENSE
      - name: Save release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ripple-universal
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Attach release downloads
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ripple-universal
          path: dist
      - name: Upload app and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
